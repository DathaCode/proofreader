services:
  web:
    build: .
    container_name: proofreader-web
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      # Persist corrections DB, usage log, config, AND the API key (data/api_key.txt)
      # across rebuilds. One folder mount — no fragile single-file bind.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1

  nginx:
    image: nginx:alpine
    container_name: proofreader-nginx
    restart: unless-stopped
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
