# Sinhala Proofreader — production stack
#   db      PostgreSQL 16 (users, sessions, corrections, logs, config)
#   api     Flask + Gemini proofreading engine (gunicorn)
#   nginx   public entrypoint on port 80, serves /static directly
#   pgadmin DB admin UI on port 5050
#
# `version:` is intentionally omitted — obsolete in Compose v2 (it only warns).

services:

  db:
    image: postgres:16-alpine
    container_name: proofreader-db
    environment:
      POSTGRES_DB:       ${POSTGRES_DB}
      POSTGRES_USER:     ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
    volumes:
      - postgres_data:/var/lib/postgresql/data
      # Runs ONLY on first init (empty volume).
      - ./init_db.sql:/docker-entrypoint-initdb.d/init.sql:ro
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER} -d ${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5

  api:
    build: .
    container_name: proofreader-api
    env_file: .env
    volumes:
      # Prompts are editable without a rebuild.
      - ./sinhala_system_prompt.txt:/app/sinhala_system_prompt.txt:ro
      - ./tamil_system_prompt.txt:/app/tamil_system_prompt.txt:ro
      - ./english_system_prompt.txt:/app/english_system_prompt.txt:ro
      # Old SQLite DB (for migration) + backups live here.
      - ./data:/app/data
    depends_on:
      db:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL",
             "python -c \"import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:5000/status', timeout=4).status==200 else 1)\""]
      interval: 10s
      timeout: 6s
      retries: 6
      start_period: 20s

  nginx:
    image: nginx:alpine
    container_name: proofreader-nginx
    ports:
      - "80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
      - ./static:/app/static:ro
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  pgadmin:
    image: dpage/pgadmin4:latest
    container_name: proofreader-pgadmin
    environment:
      PGADMIN_DEFAULT_EMAIL:    ${PGADMIN_EMAIL}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD}
      PGADMIN_CONFIG_SERVER_MODE: "False"
    ports:
      - "5050:80"
    volumes:
      - pgadmin_data:/var/lib/pgadmin
    depends_on:
      - db
    restart: unless-stopped

volumes:
  postgres_data:
  pgadmin_data:
