services:
  web:
    build: .
    container_name: proofreader-web
    restart: unless-stopped
    expose:
      - "5000"
    volumes:
      # Relative bind mount (Linux + Windows compatible). Persists the SQLite
      # corrections DB (+ its -wal/-shm files), usage log, config, and the API
      # key across rebuilds. On ext4 the WAL files live here too.
      - ./data:/app/data
    environment:
      - PYTHONUNBUFFERED=1
    # The image runs as root (python:3.11-slim default). Files it writes into
    # ./data are therefore root-owned on the host; manage them with sudo, or set
    # a matching `user: "1000:1000"` here if you prefer host-user ownership
    # (ensure ./data is writable by that uid first).

  nginx:
    image: nginx:alpine
    container_name: proofreader-nginx
    restart: unless-stopped
    ports:
      # Bind to loopback only: public access is via the Cloudflare Tunnel, which
      # connects to localhost:80. This stops the server's public IP from serving
      # port 80 directly (bypassing Cloudflare). For direct LAN/testing access
      # change back to "80:80".
      - "127.0.0.1:80:80"
    volumes:
      - ./nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - web
