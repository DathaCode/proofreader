<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Log in · Sinhala Proofreader Proxy</title>
<link rel="stylesheet" href="{{ url_for('static', filename='admin.css') }}?v=5">
<script src="{{ url_for('static', filename='admin.js') }}?v=5"></script>
</head>
<body>
{% include "_icons.html" %}
{% from "_macros.html" import icon %}
<div class="login-wrap">
  <div class="card login-card">
    <div class="brand">
      <div class="brand-logo">අ</div>
      <div><b>Sinhala Proofreader</b><span>Proxy Admin · {{ server_name }}</span></div>
    </div>
    {% with msgs = get_flashed_messages(with_categories=true) %}
      {% for cat, m in msgs %}<div class="alert {{ 'danger' if cat == 'error' else 'info' }}">{{ icon('alert') }} {{ m }}</div>{% endfor %}
    {% endwith %}
    <form method="post">
      <label class="field">Admin password
        <input type="password" name="password" autofocus autocomplete="current-password" required>
      </label>
      <button class="btn" type="submit" style="width:100%;margin-top:16px">{{ icon('lock') }} Log in</button>
    </form>
  </div>
</div>
</body>
</html>
